- name: Check Docker Engine is present
  ansible.builtin.command: docker info
  register: docker_engine_check
  changed_when: false
  failed_when: false
  become: true

- name: Fail early if Docker Engine is missing
  ansible.builtin.fail:
    msg: "Docker Engine not found on {{ inventory_hostname }}; install it before running this role"
  when: docker_engine_check.rc != 0

- name: Check Docker Compose plugin is present
  ansible.builtin.command: docker compose version
  register: compose_check
  changed_when: false
  failed_when: false
  become: true

- name: Show register object
  ansible.builtin.debug:
    var: compose_check

- name: Fail early if Docker Compose is missing
  ansible.builtin.fail:
    msg: "docker compose plugin not found on {{ inventory_hostname }}; the deploy task needs it"
  when: compose_check.rc != 0